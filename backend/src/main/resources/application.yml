server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: chemexpress-crm
  datasource:
    url: jdbc:h2:file:./data/crm;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    secret: Y2hlbWV4cHJlc3MtY3JtLWRlbW8tc2VjcmV0LWtleS0yMDI2LTExLTE4LXNlY3VyZQ==
    expire-hours: 8

logging:
  level:
    root: INFO
    com.chemexpress.crm: INFO
